modLoader="javafml"
loaderVersion="${loader_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="smputilities_logo.png"
# Vanilla and mod-less clients can join: server features work without the
# client mod; the staff panel, nametags and speech bubbles need it.
# (Before Forge 48 this is set in code, see ForgeMod.)
displayTest="IGNORE_ALL_VERSION"
description='''Made by <a href="https://discord.com/users/990003604725321808">Arthou</a>'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${loader_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="voicechat"
mandatory=false
versionRange="*"
ordering="AFTER"
side="BOTH"
