modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="smputilities_logo.png"
# Vanilla and mod-less clients can join: server features work without the
# client mod; the staff panel, nametags and speech bubbles need it.
displayTest="IGNORE_ALL_VERSION"
description='''${mod_description}'''

[[mixins]]
config="smputilities.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="voicechat"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"
