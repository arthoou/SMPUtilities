name: build

on:
  push:
    paths-ignore:
      - 'tools/probe/**'
      - '.github/workflows/probe.yml'
      - '**.md'
  pull_request:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated targets (e.g. 1.20.1-forge,1.21.1-fabric) or "all"; empty uses .github/ci-targets.txt'
        required: false
        default: ''

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core + tts-bridge (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -Psu.coreOnly=true :core:test :tts-bridge:jar

  plan:
    name: pick targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          REQUESTED: ${{ github.event.inputs.targets }}
        run: python3 tools/ci_targets.py "$REQUESTED" >> "$GITHUB_OUTPUT"

  target:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17 runs the servers of 1.18.2 to 1.20.4 in the smoke test; 21 (last) is the default.
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          set -o pipefail
          ./gradlew "-Psu.targets=${{ matrix.target }}" ":${{ matrix.target }}:build" 2>&1 | tee build.log
      - name: Error summary
        if: failure()
        run: python3 tools/ci_errors.py build.log
      - name: Count classes in the jar
        run: unzip -l dist/*.jar | grep -c '\.class$'
      - uses: actions/upload-artifact@v4
        with:
          name: SMPutilities-${{ matrix.target }}
          path: dist/*.jar
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the client smoke bot
        run: npm install --no-audit --no-fund --prefix tools/client-smoke
      - name: Smoke test (dedicated server and a vanilla client)
        run: tools/smoke.sh "${{ matrix.target }}"

  bundle:
    name: all jars
    needs: target
    if: always() && needs.target.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SMPutilities-*
          merge-multiple: true
          path: jars
      - uses: actions/upload-artifact@v4
        with:
          name: SMPutilities-all
          path: jars/*.jar
          if-no-files-found: warn
