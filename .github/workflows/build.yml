name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core + tts-bridge (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -Psu.coreOnly=true :core:test :tts-bridge:jar --stacktrace

  platform:
    name: ${{ matrix.target }}
    needs: core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - neoforge-1.21.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew :platforms:${{ matrix.target }}:build
      - uses: actions/upload-artifact@v4
        with:
          name: SMPutilities-${{ matrix.target }}
          path: dist/*.jar
          if-no-files-found: error
