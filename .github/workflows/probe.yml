name: probe
# Prints published loader and tool versions, and game API signatures per
# version (tools/probe/api.txt), to the job logs.
on:
  push:
    paths:
      - 'tools/probe/**'
      - '.github/workflows/probe.yml'
  workflow_dispatch:

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/probe/versions.sh

  api:
    name: api differences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - run: ./gradlew -q "-Psu.targets=1.18.2-fabric,1.19.2-fabric,1.19.4-fabric,1.20.1-fabric,1.20.4-fabric,1.20.6-fabric,1.21.1-fabric,1.21.3-fabric,1.21.4-fabric,1.21.5-fabric,1.21.8-fabric,1.21.10-fabric,1.21.11-fabric" apiProbe
      - run: python3 tools/probe/api_diff.py versions/*-fabric/build/api.txt
