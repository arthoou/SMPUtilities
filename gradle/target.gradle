// Build of one target (one Minecraft version + one loader). Every directory in
// versions/ uses this script; its gradle.properties says which game, loader and
// dependency versions to use. Architectury Loom handles Fabric, Forge and
// NeoForge with Mojang mappings, so all targets share the same sources.
plugins {
    id 'dev.architectury.loom'
}

// The TTS helper jar is packed into the mod's resources.
evaluationDependsOn(':tts-bridge')

def mc = project.property('minecraft_version') as String
def loader = project.property('loom.platform') as String
def javaVersion = project.property('java_version') as int
def isFabric = loader == 'fabric'
def isForge = loader == 'forge'
def isNeoForge = loader == 'neoforge'
def modRoot = rootProject.file('mod')

group = rootProject.mod_group_id
version = rootProject.mod_version
base {
    archivesName = "SMPutilities-${mc}-${loader}"
}

// ------------------------------------------------------------- sources

def flags = [loader.toUpperCase(Locale.ROOT)]
if (isForge || isNeoForge) {
    flags << 'FORGELIKE'
}

def preprocess = tasks.register('preprocessSources', su.gradle.PreprocessTask) {
    sourceRoots.from(rootProject.file('core/src/main/java'), new File(modRoot, 'src/main/java'), new File(modRoot, "src/${loader}/java"))
    swapFile = new File(modRoot, 'swaps.txt')
    minecraftVersion = mc
    it.flags.set(flags)
    outputDirectory = layout.buildDirectory.dir('preprocessed/java')
}

// Mixin configs are generated from the classes that survive preprocessing, so a
// mixin needed only on some versions simply does not exist on the others.
// Common mixins live in com.arthou.smputilities.mixin (client ones in .client),
// loader mixins in com.arthou.smputilities.<loader>.mixin.
def mixinConfigs = tasks.register('generateMixinConfigs') {
    def sources = preprocess.flatMap { it.outputDirectory }
    def output = layout.buildDirectory.dir('generated/mixins')
    inputs.dir(sources)
    outputs.dir(output)
    doLast {
        def root = sources.get().asFile
        def out = output.get().asFile
        out.mkdirs()
        def write = { String fileName, String packageName ->
            def dir = new File(root, packageName.replace('.', '/'))
            def common = []
            def client = []
            if (dir.isDirectory()) {
                dir.eachFileRecurse { file ->
                    if (file.name.endsWith('.java') && file.text.contains('@Mixin(')) {
                        def name = dir.toPath().relativize(file.toPath()).toString().replace(File.separatorChar, '.' as char) - '.java'
                        (name.startsWith('client.') ? client : common) << name
                    }
                }
            }
            def json = [
                required          : true,
                minVersion        : '0.8',
                'package'         : packageName,
                compatibilityLevel: "JAVA_${javaVersion}",
                mixins            : common.sort(),
                client            : client.sort(),
                injectors         : [defaultRequire: 1],
            ]
            new File(out, fileName).text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        }
        write('smputilities.mixins.json', 'com.arthou.smputilities.mixin')
        write("smputilities.${loader}.mixins.json", "com.arthou.smputilities.${loader}.mixin")
    }
}

sourceSets {
    main {
        java {
            srcDirs = []
            srcDir preprocess.map { it.outputDirectory }
        }
        resources {
            srcDirs = [new File(modRoot, 'src/main/resources'), new File(modRoot, "src/${loader}/resources")]
            srcDir mixinConfigs
        }
    }
}

// ---------------------------------------------------------------- loom

loom {
    silentMojangMappingsLicense()
    if (isForge) {
        forge {
            mixinConfig 'smputilities.mixins.json', 'smputilities.forge.mixins.json'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases/'
    }
    maven {
        name = 'Henkel (Simple Voice Chat API)'
        url = 'https://maven.maxhenkel.de/repository/public'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    mappings loom.officialMojangMappings()
    if (isFabric) {
        modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    } else if (isForge) {
        forge "net.minecraftforge:forge:${mc}-${project.forge_version}"
    } else {
        neoForge "net.neoforged:neoforge:${project.neoforge_version}"
    }
    // Optional integration, loaded only when Simple Voice Chat is installed.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${rootProject.voicechat_api_version}"
}

// Game runs (runServer for the CI smoke test) use the Java the target was made for.
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
    options.compilerArgs += ['-Xmaxerrs', '2000']
    dependsOn preprocess
}

// ----------------------------------------------------------- resources

def metadata = [
    mod_id            : rootProject.mod_id,
    mod_name          : rootProject.mod_name,
    mod_version       : rootProject.mod_version,
    mod_license       : rootProject.mod_license,
    mod_authors       : rootProject.mod_authors,
    mod_description   : rootProject.mod_description,
    minecraft_version : mc,
    minecraft_range   : project.property('minecraft_range'),
    loader_range      : project.findProperty('loader_range') ?: '[1,)',
    neoforge_range    : project.findProperty('neoforge_range') ?: '[0,)',
    fabric_mc_range   : project.findProperty('fabric_minecraft_range') ?: mc,
    pack_format       : project.property('pack_format'),
    java_version      : javaVersion,
]

processResources {
    inputs.properties metadata
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand metadata
    }
    // NeoForge read META-INF/mods.toml before 1.20.5.
    if (isNeoForge && project.findProperty('neoforge_legacy_toml') == 'true') {
        rename 'neoforge.mods.toml', 'mods.toml'
    }
    // The TTS desktop helper ships inside the jar and is extracted on demand.
    from(project(':tts-bridge').tasks.named('jar')) {
        into 'smputilities/voice-bridge'
    }
}

// ----------------------------------------------------------------- jars

jar {
    archiveClassifier = 'dev'
}

remapJar {
    archiveVersion = ''
    archiveClassifier = ''
}

def dist = tasks.register('dist', Copy) {
    from remapJar
    into rootProject.layout.projectDirectory.dir('dist')
}
tasks.named('build') {
    finalizedBy dist
}

// ------------------------------------------------------------ api probe

// Writes the members of game classes listed in tools/probe/api.txt (lines
// "class | regex") to build/api.txt, for comparing signatures across versions.
tasks.register('apiProbe') {
    def classpath = sourceSets.main.compileClasspath
    def spec = rootProject.file(project.findProperty('su.probeSpec') ?: 'tools/probe/api.txt')
    def output = layout.buildDirectory.file('api.txt')
    outputs.upToDateWhen { false }
    doLast {
        def javap = new File(System.getProperty('java.home'), 'bin/javap').absolutePath
        def path = classpath.asPath
        def result = new StringBuilder()
        spec.readLines().findAll { it.trim() && !it.trim().startsWith('#') }.each { line ->
            def parts = line.split('\\|', 2)
            def name = parts[0].trim()
            def pattern = java.util.regex.Pattern.compile(parts.length > 1 ? parts[1].trim() : '.')
            def process = [javap, '-p', '-cp', path, name].execute()
            def text = process.inputStream.text
            process.waitFor()
            result.append("### ${name}${process.exitValue() == 0 ? '' : ' (missing)'}\n")
            text.readLines().findAll { it.startsWith(' ') && pattern.matcher(it).find() }.each { result.append(it.trim()).append('\n') }
        }
        output.get().asFile.text = result.toString()
    }
}
